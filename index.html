<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MMF Labs</title>
  <meta name="description" content="MMF Labs is an AI, product, geospatial, mobile/web development consulting company. We also develop our own apps."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rose:    #FF6B9D;
      --mango:   #FFB347;
      --blush:   #FFE5F0;
      --sage:    #B8E0D2;
      --mid:     #2D2D3A;
      --dark:    #1E1E28;
      --muted:   #9090A8;
      --light:   #C8C8DC;
      --white:   #FFFFFF;
      --cream:   #FAF7F4;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      color: var(--white);
      line-height: 1.6;
    }

    /* ── NAV ─────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%;
      height: 68px;
      background: rgba(30,30,40,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo span {
      font-size: 1.15rem; font-weight: 700; letter-spacing: 3px;
      color: var(--white);
    }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose); }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: var(--muted); text-decoration: none; font-size: .875rem;
      font-weight: 500; transition: color .2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-cta {
      background: var(--rose); color: var(--white);
      padding: .5rem 1.25rem; border-radius: 24px;
      font-size: .875rem; font-weight: 600; text-decoration: none;
      transition: opacity .2s;
    }
    .nav-cta:hover { opacity: .88; }

    /* ── HERO ────────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 5% 80px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,157,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: .8rem; font-weight: 600; letter-spacing: 4px;
      color: var(--rose); text-transform: uppercase; margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 800; line-height: 1.08;
      margin-bottom: 1.5rem; color: var(--white);
    }
    .hero h1 em { font-style: normal; color: var(--rose); }
    .hero p {
      max-width: 560px; font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--light); font-weight: 300; margin-bottom: 3rem;
    }
    .store-buttons { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .store-btn {
      display: flex; align-items: center; gap: .75rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: .9rem 1.6rem;
      text-decoration: none; color: var(--white);
      transition: background .2s, border-color .2s;
    }
    .store-btn:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.25);
    }
    .store-btn svg { width: 28px; height: 28px; flex-shrink: 0; }
    .store-btn-text { text-align: left; }
    .store-btn-text small { display: block; font-size: .65rem; opacity: .7; font-weight: 400; }
    .store-btn-text strong { display: block; font-size: .95rem; font-weight: 600; }
    .hero-note {
      margin-top: 1.5rem; font-size: .8rem; color: var(--muted); font-weight: 400;
    }

    /* ── SECTION SHARED ──────────────────────────────────── */
    section { padding: 100px 5%; }
    .section-label {
      font-size: .75rem; font-weight: 600; letter-spacing: 4px;
      text-transform: uppercase; margin-bottom: 1rem;
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700; line-height: 1.15; margin-bottom: 1.25rem;
    }
    .section-sub {
      font-size: 1.05rem; color: var(--light);
      font-weight: 300; max-width: 540px;
    }

    /* ── FEATURES ────────────────────────────────────────── */
    .features { background: rgba(255,255,255,0.02); }
    .features-header { text-align: center; margin-bottom: 4rem; }
    .features-header .section-sub { margin: 0 auto; }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem; max-width: 1200px; margin: 0 auto;
    }
    .feature-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 2rem;
      transition: border-color .2s, background .2s;
    }
    .feature-card:hover {
      border-color: rgba(255,107,157,0.3);
      background: rgba(255,107,157,0.04);
    }
    .feature-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 1.25rem;
    }
    .feature-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: .6rem; }
    .feature-card p { font-size: .9rem; color: var(--light); font-weight: 300; line-height: 1.7; }

    /* ── SCIENCE STRIP ───────────────────────────────────── */
    .science {
      background: linear-gradient(135deg, rgba(184,224,210,0.08), rgba(255,107,157,0.06));
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }
    .science blockquote {
      max-width: 700px; margin: 0 auto;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      font-weight: 600; line-height: 1.45; color: var(--white);
    }
    .science blockquote em { font-style: normal; color: var(--sage); }
    .science cite {
      display: block; margin-top: 1.5rem;
      font-size: .85rem; color: var(--muted); font-style: normal; font-weight: 400;
    }

    /* ── STATS ───────────────────────────────────────────── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem; max-width: 900px; margin: 0 auto; text-align: center;
    }
    .stat-item strong {
      display: block; font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 800; line-height: 1; margin-bottom: .4rem;
    }
    .stat-item span { font-size: .9rem; color: var(--light); font-weight: 300; }

    /* ── DISCLAIMER ──────────────────────────────────────── */
    .disclaimer {
      background: rgba(255,179,71,0.06);
      border: 1px solid rgba(255,179,71,0.2);
      border-radius: 16px; padding: 1.5rem 2rem;
      max-width: 780px; margin: 3rem auto 0;
      text-align: center;
    }
    .disclaimer p {
      font-size: .85rem; color: rgba(255,255,255,0.65);
      font-weight: 300; line-height: 1.7;
    }
    .disclaimer strong { color: var(--mango); font-weight: 600; }

    /* ── CTA ─────────────────────────────────────────────── */
    .cta { text-align: center; }
    .cta .section-title { color: var(--white); }
    .cta p { color: var(--light); max-width: 480px; margin: 0 auto 2.5rem; font-weight: 300; }
    .cta-primary {
      display: inline-block;
      background: var(--rose); color: var(--white);
      padding: 1rem 2.5rem; border-radius: 32px;
      font-size: 1rem; font-weight: 600; text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .cta-primary:hover { opacity: .9; transform: translateY(-1px); }

    /* ── FOOTER ──────────────────────────────────────────── */
    footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 3rem 5%;
      display: flex; flex-wrap: wrap; gap: 2rem;
      align-items: center; justify-content: space-between;
    }
    .footer-logo { display: flex; align-items: center; gap: 8px; }
    .footer-logo span { font-size: 1rem; font-weight: 700; letter-spacing: 3px; color: var(--muted); }
    .footer-links { display: flex; gap: 2rem; flex-wrap: wrap; }
    .footer-links a {
      color: var(--muted); text-decoration: none;
      font-size: .85rem; font-weight: 400; transition: color .2s;
    }
    .footer-links a:hover { color: var(--white); }
    .footer-copy { font-size: .8rem; color: var(--muted); width: 100%; }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .store-buttons { flex-direction: column; align-items: center; }
      footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
